appId: com.zapret.gui
productName: Zapret GUI
copyright: Copyright © 2026 avencores
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - bundled-assets/**/*
extraResources:
  - from: bundled-assets
    to: bundled-assets
win:
  icon: bundled-assets/icon.ico
  target:
    - nsis
  # No UAC prompt on launch: the app runs as the invoking user and only
  # re-asks for elevation on demand (AdminBanner → "relaunch as admin").
  requestedExecutionLevel: asInvoker
  # Apply icon + metadata via rcedit, but skip code signing (no certificate).
  signExecutable: false
  # Unsigned builds cannot pass Authenticode verification — without this
  # electron-updater refuses to install downloaded updates on Windows.
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  # Show the GPL-3.0 text as the installer EULA page.
  license: LICENSE
  # Single deterministic installer name (matches the release notes pattern).
  artifactName: Zapret-GUI-Setup-${version}.${ext}
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerIcon: bundled-assets/icon.ico
  installerHeaderIcon: bundled-assets/icon.ico
  uninstallerIcon: bundled-assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Zapret GUI
  # NSIS installer itself requests elevation; the app also re-asks via UAC on demand.
  perMachine: false
linux:
  icon: build/app-icon.png
  category: Network
  description: Desktop GUI for zapret DPI bypass (nfqws + nftables) — Discord / YouTube / Telegram
  maintainer: avencores
  vendor: avencores
  synopsis: Zapret DPI bypass manager (nfqws + nftables)
  syncDesktopName: true
  # Only native distro packages: .deb for apt-based distros, .rpm for dnf-based.
  # No AppImage / snap / flatpak targets.
  target:
    - deb
    - rpm
deb:
  packageName: zapret-gui
  artifactName: Zapret-GUI-${version}.${ext}
  depends:
    - nftables
    - iproute2
    - procps
    - polkit-1 | policykit-1
rpm:
  packageName: zapret-gui
  artifactName: Zapret-GUI-${version}.${ext}
  depends:
    - nftables
    - iproute
    - procps-ng
    - polkit
publish:
  provider: github
  owner: createprojectile
  repo: zapret-gui-nodejs
  releaseType: release
